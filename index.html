<style>

*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  margin:0;
  min-height:100%;
  font-family:system-ui,-apple-system,sans-serif;
  color:white;
}

body{
  min-height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  overflow-x:hidden;

  background:
    radial-gradient(circle at 50% 0%,#334d7a 0%,transparent 40%),
    linear-gradient(145deg,#070b13,#151c2d 55%,#080b12);
}

.game{
  width:min(950px,94vw);
  padding:22px 0 35px;
  text-align:center;
}

h1{
  margin:0;
  font-size:clamp(32px,8vw,62px);
  line-height:1;
  font-weight:1000;
  letter-spacing:-2px;

  background:
    linear-gradient(
      90deg,
      #39c9ff,
      #fff,
      #ff4855
    );

  color:transparent;
  background-clip:text;
}

.subtitle{
  margin:8px 0 22px;
  font-size:13px;
  font-weight:900;
  letter-spacing:4px;
  opacity:.75;
}

.randomizer{
  position:relative;
  padding:20px;
  border-radius:28px;
  border:1px solid #ffffff2b;

  background:#ffffff0b;

  box-shadow:
    0 20px 60px #0008,
    inset 0 0 40px #ffffff06;

  backdrop-filter:blur(10px);
}


/* ================================
   COMBO
================================ */

.combo{
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:0;

  margin:8px auto 20px;

  width:min(500px,100%);
}

.part{
  width:100%;
  min-height:105px;

  display:flex;
  align-items:center;
  justify-content:center;

  position:relative;
  padding:15px 20px;

  border:1px solid #ffffff25;

  background:
    linear-gradient(
      135deg,
      #ffffff10,
      #ffffff04
    );

  box-shadow:
    inset 0 0 20px #0005;
}

.part:first-child{
  border-radius:20px 20px 8px 8px;
}

.part:last-child{
  border-radius:8px 8px 20px 20px;
}

.part + .part{
  border-top:0;
}

.partLabel{
  position:absolute;

  left:14px;
  top:8px;

  font-size:10px;
  font-weight:1000;
  letter-spacing:2px;

  opacity:.6;
}

.partName{
  font-size:clamp(20px,5vw,30px);
  font-weight:1000;
  text-transform:uppercase;
}

.partSymbol{
  font-size:38px;
  margin-right:13px;
}

.connector{
  width:24px;
  height:16px;

  background:
    linear-gradient(
      90deg,
      #39c9ff,
      #ffffff,
      #ff4855
    );

  border-radius:0 0 8px 8px;

  box-shadow:
    0 0 15px #ffffff66;

  z-index:5;
}


/* ================================
   ASSIST
================================ */

.assistPart{
  display:none;

  width:100%;
  min-height:90px;

  position:relative;

  align-items:center;
  justify-content:center;

  padding:15px 20px;

  border:1px solid #ffffff25;

  background:
    linear-gradient(
      135deg,
      #ff4b5518,
      #39c9ff0d
    );

  border-radius:8px;

  box-shadow:
    inset 0 0 20px #0005;
}

.assistPart.show{
  display:flex;
}

.assistPart .partLabel{
  color:#ff7780;
}

.assistName{
  font-size:clamp(19px,5vw,27px);

  font-weight:1000;

  text-transform:uppercase;
}


/* ================================
   PREVIEW
================================ */

.previewArea{
  height:270px;

  margin:15px auto;

  display:flex;

  justify-content:center;
  align-items:center;

  position:relative;

  overflow:hidden;

  border-radius:22px;

  background:
    radial-gradient(
      circle,
      #334c72,
      #111827 50%,
      #080b12
    );

  border:1px solid #ffffff22;
}

.previewArea::before{
  content:"";

  position:absolute;

  width:210px;
  height:210px;

  border-radius:50%;

  border:2px solid #ffffff18;

  box-shadow:
    0 0 50px #39c9ff15,
    inset 0 0 30px #0008;
}

.previewTop{
  position:relative;

  width:145px;
  height:145px;

  border-radius:50%;

  background:
    conic-gradient(
      #39c9ff,
      #1265ff,
      white,
      #ff4855,
      #8c1220,
      white,
      #39c9ff
    );

  border:7px solid #ddd;

  box-shadow:
    0 0 20px #ffffff77,
    0 0 50px #39c9ff33,
    inset 0 0 18px #0009;

  animation:
    slowSpin 2s linear infinite;
}

.previewTop::before{
  content:"";

  position:absolute;

  width:48px;
  height:48px;

  left:50%;
  top:50%;

  transform:translate(-50%,-50%);

  border-radius:50%;

  background:
    radial-gradient(
      circle,
      #eee,
      #555
    );

  border:5px solid #111;

  box-shadow:
    0 0 12px #fff;
}

.previewTop::after{
  content:"";

  position:absolute;

  inset:12px;

  border-radius:50%;

  border:3px dashed #ffffffbb;
}

@keyframes slowSpin{
  to{
    transform:rotate(360deg);
  }
}

.previewTop.randomizing{
  animation:
    fastSpin .12s linear infinite;
}

@keyframes fastSpin{
  to{
    transform:rotate(360deg);
  }
}


/* ================================
   BUTTON
================================ */

.randomButton{
  width:100%;

  max-width:500px;

  min-height:62px;

  border:0;

  border-radius:18px;

  cursor:pointer;

  color:white;

  font-size:20px;

  font-weight:1000;

  letter-spacing:1px;

  background:
    linear-gradient(
      90deg,
      #168cff,
      #31c9ff 48%,
      #ff3548
    );

  box-shadow:
    0 8px 30px #168cff33;

  transition:
    transform .12s,
    filter .12s;
}

.randomButton:hover{
  filter:brightness(1.15);
}

.randomButton:active{
  transform:scale(.97);
}


/* ================================
   STATS
================================ */

.stats{
  display:grid;

  grid-template-columns:
    repeat(3,1fr);

  gap:8px;

  margin:18px auto;

  max-width:650px;
}

.stat{
  padding:13px 8px;

  border-radius:15px;

  background:#ffffff0c;

  border:1px solid #ffffff1f;
}

.statTitle{
  font-size:10px;

  font-weight:1000;

  letter-spacing:2px;

  opacity:.55;
}

.statValue{
  margin-top:4px;

  font-size:22px;

  font-weight:1000;
}


/* ================================
   HISTORY
================================ */

.collection{
  margin-top:20px;
  text-align:left;
}

.collectionHeader{
  display:flex;

  justify-content:space-between;
  align-items:center;

  margin-bottom:10px;
}

.collectionHeader h2{
  margin:0;
  font-size:20px;
}

.clearButton{
  border:0;

  padding:7px 12px;

  border-radius:999px;

  background:#ffffff12;

  color:white;

  font-weight:800;

  cursor:pointer;
}

.history{
  display:grid;

  grid-template-columns:
    repeat(auto-fill,minmax(200px,1fr));

  gap:8px;

  max-height:300px;

  overflow-y:auto;
}

.historyItem{
  padding:12px;

  border-radius:14px;

  background:#ffffff09;

  border:1px solid #ffffff18;

  font-size:12px;

  font-weight:800;

  line-height:1.5;
}

.historyItem strong{
  color:#62d8ff;
}

.cxText{
  color:#ff6b72;
}

.naText{
  opacity:.45;
}


/* ================================
   MOBILE
================================ */

@media(max-width:600px){

  .game{

  }

  .statValue{
    font-size:18px;
  }

  .history{
    grid-template-columns:
      repeat(2,1fr);
  }

}

/* =====================================================
   ASSIST BLADES
===================================================== */

const assistBlades = [

  "Heavy",
  "Wheel",
  "Knuckle",
  "Assault",
  "Erase",
  "Free",
  "Jaggy",
  "Slash",
  "Round",
  "Bumper",
  "Vertical",
  "Dual"

];


/* =====================================================
   ELEMENTS
===================================================== */

const bladeName =
document.getElementById("bladeName");

const assistPart =
document.getElementById("assistPart");

const assistName =
document.getElementById("assistName");

const ratchetName =
document.getElementById("ratchetName");

const bitName =
document.getElementById("bitName");

const attackStat =
document.getElementById("attackStat");

const defenseStat =
document.getElementById("defenseStat");

const staminaStat =
document.getElementById("staminaStat");

const previewTop =
document.getElementById("previewTop");

const randomButton =
document.getElementById("randomButton");

const history =
document.getElementById("history");

const clearButton =
document.getElementById("clearButton");


/* =====================================================
   RANDOM PICK
===================================================== */

function randomPart(list){

  return list[
    Math.floor(
      Math.random()*list.length
    )
  ];

}


/* =====================================================
   RANDOMIZE
===================================================== */

function randomize(){

  randomButton.disabled=true;

  previewTop.classList.add(
    "randomizing"
  );

  let flashes=0;

  const interval=setInterval(()=>{

    bladeName.textContent =
      randomPart(blades).name;

    ratchetName.textContent =
      randomPart(
        ratchets.concat(
          specialRatchets
        )
      ).name;

    bitName.textContent =
      randomPart(bits).name;

    flashes++;

    if(flashes>=14){

      clearInterval(interval);

      finishRandom();

    }

  },85);

}


/* =====================================================
   FINISH RANDOM
===================================================== */

function finishRandom(){

  /*
    Blade must be selected first
    because it controls the rules.
  */

  const blade =
    randomPart(blades);

  let ratchet;
  let bit;
  let assist=null;


  /* =================================================
     GLORY VALKYRIE / BULLET GRIFFON
     
     RATCHET = N/A
  ================================================= */

  if(blade.noRatchet){

    ratchet={

      name:"N/A",

      attack:0,
      defense:0,
      stamina:0

    };

  }


  /* =================================================
     CLOCK MIRAGE
     
     ONLY:
     4-55
     7-55
     9-65
  ================================================= */

  else if(blade.simpleRatchet){

    const simpleRatchets =
      ratchets.filter(
        r => r.simple === true
      );

    ratchet =
      randomPart(
        simpleRatchets
      );

  }


  /* =================================================
     NORMAL BLADE
     
     CAN USE NORMAL + SPECIAL RATCHETS
  ================================================= */

  else{

    ratchet =
      randomPart(
        ratchets.concat(
          specialRatchets
        )
      );

  }


  /* =================================================
     Tr / Op
     
     BIT = N/A
  ================================================= */

  if(ratchet.special){

    bit={

      name:"N/A",

      attack:0,
      defense:0,
      stamina:0

    };

  }

  else{

    bit =
      randomPart(bits);

  }


  /* =================================================
     CX BLADE
     
     RANDOM ASSIST BLADE
  ================================================= */

  if(blade.cx){

    assist =
      randomPart(
        assistBlades
      );

  }


  /* =================================================
     DISPLAY BLADE
  ================================================= */

  bladeName.textContent =
    blade.name +
    (
      blade.cx
        ? " (CX)"
        : ""
    );


  /* =================================================
     DISPLAY ASSIST
  ================================================= */

  if(assist){

    assistName.textContent =
      assist;

    assistPart.classList.add(
      "show"
    );

  }

  else{

    assistName.textContent =
      "N/A";

    assistPart.classList.remove(
      "show"
    );

  }


  /* =================================================
     DISPLAY RATCHET
  ================================================= */

  ratchetName.textContent =
    ratchet.name;


  /* =================================================
     DISPLAY BIT
  ================================================= */

  bitName.textContent =
    bit.name;


  /* =================================================
     STATS
  ================================================= */

  const attack =
    blade.attack +
    ratchet.attack +
    bit.attack;

  const defense =
    blade.defense +
    ratchet.defense +
    bit.defense;

  const stamina =
    blade.stamina +
    ratchet.stamina +
    bit.stamina;


  attackStat.textContent =
    attack + "/30";

  defenseStat.textContent =
    defense + "/30";

  staminaStat.textContent =
    stamina + "/30";


  /* =================================================
     STOP ANIMATION
  ================================================= */

  previewTop.classList.remove(
    "randomizing"
  );

  randomButton.disabled=false;


  /* =================================================
     SAVE COMBO
  ================================================= */

  saveCombo(
    blade,
    assist,
    ratchet,
    bit,
    attack,
    defense,
    stamina
  );

}


/* =====================================================
   SAVE COMBO
===================================================== */

function saveCombo(
  blade,
  assist,
  ratchet,
  bit,
  attack,
  defense,
  stamina
){

  const combo={

    blade:blade.name,

    cx:blade.cx,

    assist:assist,

    ratchet:ratchet.name,

    bit:bit.name,

    attack:attack,

    defense:defense,

    stamina:stamina

  };


  let combos =
    JSON.parse(
      localStorage.getItem(
        "spinClashCombos"
      )
    ) || [];


  combos.unshift(combo);


  combos =
    combos.slice(0,30);


  localStorage.setItem(
    "spinClashCombos",
    JSON.stringify(combos)
  );


  renderHistory();

}


/* =====================================================
   HISTORY
===================================================== */

function renderHistory(){

  let combos =
    JSON.parse(
      localStorage.getItem(
        "spinClashCombos"
      )
    ) || [];


  history.innerHTML="";


  if(combos.length===0){

    history.innerHTML=`

      <div class="historyItem">

        No combos yet.

        <br>

        Press RANDOMIZE!

      </div>

    `;

    return;

  }


  combos.forEach(
    (combo,index)=>{

      const item =
        document.createElement(
          "div"
        );


      item.className =
        "historyItem";


      const cx =
        combo.cx
          ? " <span class='cxText'>(CX)</span>"
          : "";


      const assistHTML =
        combo.assist
          ? `
            <br>
            🔩 ${combo.assist}
          `
          : "";


      const bitHTML =
        combo.bit==="N/A"
          ? `
            <br>
            🔻
            <span class="naText">
              N/A
            </span>
          `
          : `
            <br>
            🔻 ${combo.bit}
          `;


      const ratchetHTML =
        combo.ratchet==="N/A"
          ? `
            <br>
            ⚙️
            <span class="naText">
              N/A
            </span>
          `
          : `
            <br>
            ⚙️ ${combo.ratchet}
          `;


      item.innerHTML=`

        <strong>
          #${index+1}
        </strong>

        <br><br>

        ⚔️ ${combo.blade}${cx}

        ${assistHTML}

        ${ratchetHTML}

        ${bitHTML}

        <br><br>

        ⚡ ${combo.attack}

        &nbsp;

        🛡️ ${combo.defense}

        &nbsp;

        🌀 ${combo.stamina}

      `;


      history.appendChild(
        item
      );

    }
  );

}


/* =====================================================
   CLEAR HISTORY
===================================================== */

clearButton.onclick=()=>{

  localStorage.removeItem(
    "spinClashCombos"
  );

  renderHistory();

};


/* =====================================================
   RANDOMIZE BUTTON
===================================================== */

randomButton.onclick =
  randomize;


/* =====================================================
   INITIALIZE
===================================================== */

renderHistory();

</script>

</body>
</html>
