<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">

<meta name="viewport"
      content="width=device-width,
               initial-scale=1.0,
               maximum-scale=1.0,
               user-scalable=no">

<title>Beyblade X — Combo Randomizer</title>

<style>

*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  margin:0;
  min-height:100%;
  font-family:system-ui,-apple-system,sans-serif;
  color:white;
}

body{
  min-height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  overflow-x:hidden;

  background:
    radial-gradient(circle at 50% 0%,#334d7a 0%,transparent 40%),
    linear-gradient(145deg,#070b13,#151c2d 55%,#080b12);
}

.game{
  width:min(950px,94vw);
  padding:22px 0 35px;
  text-align:center;
}

h1{
  margin:0;

  font-size:
    clamp(32px,8vw,62px);

  line-height:1;

  font-weight:1000;
  letter-spacing:-2px;

  background:
    linear-gradient(
      90deg,
      #39c9ff,
      #fff,
      #ff4855
    );

  color:transparent;
  background-clip:text;
}

.subtitle{
  margin:8px 0 22px;

  font-size:13px;
  font-weight:900;

  letter-spacing:4px;

  opacity:.75;
}

/* ================================
   RANDOMIZER
================================ */

.randomizer{
  position:relative;

  padding:20px;

  border-radius:28px;

  border:1px solid #ffffff2b;

  background:#ffffff0b;

  box-shadow:
    0 20px 60px #0008,
    inset 0 0 40px #ffffff06;

  backdrop-filter:blur(10px);
}

/* ================================
   COMBO DISPLAY
================================ */

.combo{
  display:flex;

  flex-direction:column;

  align-items:center;

  gap:0;

  margin:8px auto 20px;

  width:min(430px,100%);
}

.part{
  width:100%;

  min-height:105px;

  display:flex;

  align-items:center;

  justify-content:center;

  position:relative;

  padding:15px 20px;

  border:1px solid #ffffff25;

  background:
    linear-gradient(
      135deg,
      #ffffff10,
      #ffffff04
    );

  box-shadow:
    inset 0 0 20px #0005;
}

.part:first-child{
  border-radius:20px 20px 8px 8px;
}

.part:last-child{
  border-radius:8px 8px 20px 20px;
}

.part + .part{
  border-top:0;
}

.partLabel{
  position:absolute;

  left:14px;
  top:8px;

  font-size:10px;

  font-weight:1000;

  letter-spacing:2px;

  opacity:.6;
}

.partName{
  font-size:
    clamp(20px,5vw,30px);

  font-weight:1000;

  text-transform:uppercase;
}

.partSymbol{
  font-size:38px;

  margin-right:13px;
}

/* ================================
   CENTER CONNECTORS
================================ */

.connector{
  width:24px;
  height:16px;

  background:
    linear-gradient(
      90deg,
      #39c9ff,
      #ffffff,
      #ff4855
    );

  border-radius:0 0 8px 8px;

  box-shadow:
    0 0 15px #ffffff66;

  z-index:5;
}

/* ================================
   SPIN PREVIEW
================================ */

.previewArea{
  height:270px;

  margin:15px auto;

  display:flex;

  justify-content:center;
  align-items:center;

  position:relative;

  overflow:hidden;

  border-radius:22px;

  background:
    radial-gradient(
      circle,
      #334c72,
      #111827 50%,
      #080b12
    );

  border:1px solid #ffffff22;
}

.previewArea::before{
  content:"";

  position:absolute;

  width:210px;
  height:210px;

  border-radius:50%;

  border:2px solid #ffffff18;

  box-shadow:
    0 0 50px #39c9ff15,
    inset 0 0 30px #0008;
}

.previewTop{
  position:relative;

  width:145px;
  height:145px;

  border-radius:50%;

  background:
    conic-gradient(
      #39c9ff,
      #1265ff,
      white,
      #ff4855,
      #8c1220,
      white,
      #39c9ff
    );

  border:7px solid #ddd;

  box-shadow:
    0 0 20px #ffffff77,
    0 0 50px #39c9ff33,
    inset 0 0 18px #0009;

  animation:
    slowSpin 2s linear infinite;
}

.previewTop::before{
  content:"";

  position:absolute;

  width:48px;
  height:48px;

  left:50%;
  top:50%;

  transform:translate(-50%,-50%);

  border-radius:50%;

  background:
    radial-gradient(
      circle,
      #eee,
      #555
    );

  border:5px solid #111;

  box-shadow:
    0 0 12px #fff;
}

.previewTop::after{
  content:"";

  position:absolute;

  inset:12px;

  border-radius:50%;

  border:
    3px dashed #ffffffbb;
}

@keyframes slowSpin{
  to{
    transform:rotate(360deg);
  }
}

.previewTop.randomizing{
  animation:
    fastSpin .12s linear infinite;
}

@keyframes fastSpin{
  to{
    transform:rotate(360deg);
  }
}

/* ================================
   BUTTON
================================ */

.randomButton{
  width:100%;

  max-width:500px;

  min-height:62px;

  border:0;

  border-radius:18px;

  cursor:pointer;

  color:white;

  font-size:20px;

  font-weight:1000;

  letter-spacing:1px;

  background:
    linear-gradient(
      90deg,
      #168cff,
      #31c9ff 48%,
      #ff3548
    );

  box-shadow:
    0 8px 30px #168cff33;

  transition:
    transform .12s,
    filter .12s;
}

.randomButton:hover{
  filter:brightness(1.15);
}

.randomButton:active{
  transform:scale(.97);
}

/* ================================
   STATS
================================ */

.stats{
  display:grid;

  grid-template-columns:
    repeat(3,1fr);

  gap:8px;

  margin:18px auto;

  max-width:650px;
}

.stat{
  padding:13px 8px;

  border-radius:15px;

  background:#ffffff0c;

  border:1px solid #ffffff1f;
}

.statTitle{
  font-size:10px;

  font-weight:1000;

  letter-spacing:2px;

  opacity:.55;
}

.statValue{
  margin-top:4px;

  font-size:22px;

  font-weight:1000;
}

/* ================================
   COLLECTION
================================ */

.collection{
  margin-top:20px;

  text-align:left;
}

.collectionHeader{
  display:flex;

  justify-content:space-between;
  align-items:center;

  margin-bottom:10px;
}

.collectionHeader h2{
  margin:0;

  font-size:20px;
}

.clearButton{
  border:0;

  padding:7px 12px;

  border-radius:999px;

  background:#ffffff12;

  color:white;

  font-weight:800;

  cursor:pointer;
}

.history{
  display:grid;

  grid-template-columns:
    repeat(auto-fill,minmax(180px,1fr));

  gap:8px;

  max-height:240px;

  overflow-y:auto;
}

.historyItem{
  padding:12px;

  border-radius:14px;

  background:#ffffff09;

  border:1px solid #ffffff18;

  font-size:12px;

  font-weight:800;
}

.historyItem strong{
  color:#62d8ff;
}

/* ================================
   MOBILE
================================ */

@media(max-width:600px){

  .game{
    width:94vw;
    padding-top:15px;
  }

  .randomizer{
    padding:12px;
    border-radius:22px;
  }

  .previewArea{
    height:220px;
  }

  .previewTop{
    width:125px;
    height:125px;
  }

  .stats{
    grid-template-columns:
      repeat(3,1fr);
  }

  .statValue{
    font-size:18px;
  }

  .history{
    grid-template-columns:
      repeat(2,1fr);
  }

}

</style>
</head>

<body>

<div class="game">

<h1>SPIN CLASH X</h1>

<p class="subtitle">
BEYBLADE X COMBO RANDOMIZER
</p>


<div class="randomizer">

<!-- ============================
     COMBO
============================= -->

<div class="combo">

  <div class="part">

    <span class="partLabel">
      BLADE
    </span>

    <span class="partSymbol">
      ⚔️
    </span>

    <span
      id="bladeName"
      class="partName"
    >
      —
    </span>

  </div>


  <div class="connector"></div>


  <div class="part">

    <span class="partLabel">
      RATCHET
    </span>

    <span class="partSymbol">
      ⚙️
    </span>

    <span
      id="ratchetName"
      class="partName"
    >
      —
    </span>

  </div>


  <div class="connector"></div>


  <div class="part">

    <span class="partLabel">
      BIT
    </span>

    <span class="partSymbol">
      🔻
    </span>

    <span
      id="bitName"
      class="partName"
    >
      —
    </span>

  </div>

</div>


<!-- ============================
     PREVIEW
============================= -->

<div class="previewArea">

  <div
    id="previewTop"
    class="previewTop"
  ></div>

</div>


<!-- ============================
     BUTTON
============================= -->

<button
  id="randomButton"
  class="randomButton"
>
  🎲 RANDOMIZE COMBO
</button>


<!-- ============================
     STATS
============================= -->

<div class="stats">

  <div class="stat">

    <div class="statTitle">
      ATTACK
    </div>

    <div
      id="attackStat"
      class="statValue"
    >
      —
    </div>

  </div>


  <div class="stat">

    <div class="statTitle">
      DEFENSE
    </div>

    <div
      id="defenseStat"
      class="statValue"
    >
      —
    </div>

  </div>


  <div class="stat">

    <div class="statTitle">
      STAMINA
    </div>

    <div
      id="staminaStat"
      class="statValue"
    >
      —
    </div>

  </div>

</div>


<!-- ============================
     HISTORY
============================= -->

<div class="collection">

  <div class="collectionHeader">

    <h2>
      🎒 Generated Combos
    </h2>

    <button
      id="clearButton"
      class="clearButton"
    >
      Clear
    </button>

  </div>


  <div
    id="history"
    class="history"
  ></div>

</div>

</div>

</div>


<script>

/* ==================================
   PART DATABASE
================================== */

/*
  These are example/custom part names
  for the randomizer.

  You can freely replace these with
  the parts you own.
*/


const blades = [

  {
    name:"Dran Sword",
    attack:9,
    defense:3,
    stamina:4
  },

  {
    name:"Wizard Arrow",
    attack:3,
    defense:6,
    stamina:9
  },

  {
    name:"Shark Edge",
    attack:10,
    defense:3,
    stamina:5
  },

  {
    name:"Hells Scythe",
    attack:7,
    defense:5,
    stamina:7
  },

  {
    name:"Knight Shield",
    attack:3,
    defense:10,
    stamina:6
  },

  {
    name:"Leon Claw",
    attack:8,
    defense:7,
    stamina:4
  },

  {
    name:"Phoenix Wing",
    attack:9,
    defense:6,
    stamina:7
  },

  {
    name:"Rhino Horn",
    attack:5,
    defense:9,
    stamina:5
  },

  {
    name:"Cobalt Dragoon",
    attack:8,
    defense:5,
    stamina:8
  },

  {
    name:"Silver Wolf",
    attack:5,
    defense:6,
    stamina:9
  }

];


const ratchets = [

  {
    name:"3-60",
    attack:7,
    defense:5,
    stamina:6
  },

  {
    name:"3-80",
    attack:5,
    defense:7,
    stamina:6
  },

  {
    name:"4-60",
    attack:6,
    defense:6,
    stamina:6
  },

  {
    name:"4-80",
    attack:4,
    defense:8,
    stamina:5
  },

  {
    name:"5-60",
    attack:7,
    defense:6,
    stamina:5
  },

  {
    name:"5-80",
    attack:4,
    defense:9,
    stamina:4
  },

  {
    name:"9-60",
    attack:8,
    defense:4,
    stamina:5
  },

  {
    name:"7-70",
    attack:5,
    defense:7,
    stamina:6
  }

];


const bits = [

  {
    name:"Flat",
    attack:9,
    defense:3,
    stamina:4
  },

  {
    name:"Rush",
    attack:10,
    defense:2,
    stamina:3
  },

  {
    name:"Point",
    attack:6,
    defense:5,
    stamina:8
  },

  {
    name:"Ball",
    attack:3,
    defense:8,
    stamina:9
  },

  {
    name:"Needle",
    attack:2,
    defense:10,
    stamina:7
  },

  {
    name:"High Needle",
    attack:2,
    defense:9,
    stamina:7
  },

  {
    name:"Gear Flat",
    attack:10,
    defense:3,
    stamina:4
  },

  {
    name:"Orb",
    attack:4,
    defense:6,
    stamina:9
  },

  {
    name:"Taper",
    attack:7,
    defense:5,
    stamina:7
  },

  {
    name:"Flat Ball",
    attack:7,
    defense:6,
    stamina:6
  }

];


/* ==================================
   ELEMENTS
================================== */

const bladeName=
document.getElementById("bladeName");

const ratchetName=
document.getElementById("ratchetName");

const bitName=
document.getElementById("bitName");

const attackStat=
document.getElementById("attackStat");

const defenseStat=
document.getElementById("defenseStat");

const staminaStat=
document.getElementById("staminaStat");

const previewTop=
document.getElementById("previewTop");

const randomButton=
document.getElementById("randomButton");

const history=
document.getElementById("history");

const clearButton=
document.getElementById("clearButton");


/* ==================================
   RANDOM FUNCTION
================================== */

function randomPart(list){

  return list[
    Math.floor(
      Math.random()*list.length
    )
  ];

}


/* ==================================
   RANDOMIZE
================================== */

function randomize(){

  randomButton.disabled=true;

  previewTop.classList.add(
    "randomizing"
  );


  /*
    Quick visual shuffle
  */

  let flashes=0;


  const interval=
  setInterval(()=>{

    bladeName.textContent=
      randomPart(blades).name;

    ratchetName.textContent=
      randomPart(ratchets).name;

    bitName.textContent=
      randomPart(bits).name;

    flashes++;

    if(flashes>=12){

      clearInterval(interval);

      finishRandom();

    }

  },90);

}


/* ==================================
   FINISH RANDOMIZER
================================== */

function finishRandom(){

  const blade=
    randomPart(blades);

  const ratchet=
    randomPart(ratchets);

  const bit=
    randomPart(bits);


  /* DISPLAY */

  bladeName.textContent=
    blade.name;

  ratchetName.textContent=
    ratchet.name;

  bitName.textContent=
    bit.name;


  /* CALCULATE STATS */

  const attack=
    blade.attack+
    ratchet.attack+
    bit.attack;

  const defense=
    blade.defense+
    ratchet.defense+
    bit.defense;

  const stamina=
    blade.stamina+
    ratchet.stamina+
    bit.stamina;


  attackStat.textContent=
    attack+"/30";

  defenseStat.textContent=
    defense+"/30";

  staminaStat.textContent=
    stamina+"/30";


  previewTop.classList.remove(
    "randomizing"
  );


  randomButton.disabled=false;


  saveCombo(
    blade,
    ratchet,
    bit,
    attack,
    defense,
    stamina
  );

}


/* ==================================
   SAVE COMBO
================================== */

function saveCombo(
  blade,
  ratchet,
  bit,
  attack,
  defense,
  stamina
){

  const combo={

    blade:blade.name,

    ratchet:ratchet.name,

    bit:bit.name,

    attack,
    defense,
    stamina

  };


  let combos=
    JSON.parse(
      localStorage.getItem(
        "spinClashCombos"
      )
    ) || [];


  combos.unshift(combo);


  /*
    Keep the latest 30 combos
  */

  combos=
    combos.slice(0,30);


  localStorage.setItem(
    "spinClashCombos",
    JSON.stringify(combos)
  );


  renderHistory();

}


/* ==================================
   HISTORY
================================== */

function renderHistory(){

  let combos=
    JSON.parse(
      localStorage.getItem(
        "spinClashCombos"
      )
    ) || [];


  history.innerHTML="";


  if(combos.length===0){

    history.innerHTML=`
      <div class="historyItem">
        No combos yet.
        Press RANDOMIZE!
      </div>
    `;

    return;

  }


  combos.forEach(
    (combo,index)=>{

      const item=
        document.createElement("div");

      item.className=
        "historyItem";

      item.innerHTML=`

        <strong>
          #${index+1}
        </strong>

        <br><br>

        ⚔️ ${combo.blade}

        <br>

        ⚙️ ${combo.ratchet}

        <br>

        🔻 ${combo.bit}

        <br><br>

        ⚡ ${combo.attack}

        &nbsp;

        🛡️ ${combo.defense}

        &nbsp;

        🌀 ${combo.stamina}

      `;

      history.appendChild(item);

    }
  );

}


/* ==================================
   CLEAR HISTORY
================================== */

clearButton.onclick=()=>{

  localStorage.removeItem(
    "spinClashCombos"
  );

  renderHistory();

};


/* ==================================
   BUTTON
================================== */

randomButton.onclick=
  randomize;


/* ==================================
   LOAD
================================== */

renderHistory();

</script>

</body>
</html>
